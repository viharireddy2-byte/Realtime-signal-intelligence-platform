apiVersion: v2
name: signal-intel-platform
description: Helm chart for the Real-Time Signal Intelligence Platform
type: application
version: 0.1.0
appVersion: "2.0.0"

keywords:
  - kafka
  - flink
  - spark
  - timescaledb
  - redis
  - streaming
  - analytics
  - anomaly-detection

home: https://github.com/YOUR_GITHUB_USERNAME/realtime-signal-intelligence-platform
sources:
  - https://github.com/YOUR_GITHUB_USERNAME/realtime-signal-intelligence-platform

maintainers:
  - name: Platform Team
    email: platform-team@example.com

dependencies:
  - name: kafka
    version: "26.11.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled

  - name: redis
    version: "18.19.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  - name: postgresql
    version: "13.4.4"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: prometheus
    version: "25.19.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled

  - name: grafana
    version: "7.3.9"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled
