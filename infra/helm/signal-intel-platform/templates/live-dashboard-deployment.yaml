{{- if .Values.services.liveDashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-live-dashboard
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
    {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "live-dashboard") | nindent 4 }}
spec:
  replicas: {{ .Values.services.liveDashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "live-dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "live-dashboard") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: live-dashboard
          image: {{ include "signal-intel-platform.image" (dict "root" $ "repository" .Values.services.liveDashboard.image.repository "tag" .Values.services.liveDashboard.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.services.liveDashboard.containerPort }}
          env:
            - name: QUERY_API_WS_URL
              value: "ws://{{ .Release.Name }}-query-api:{{ .Values.services.queryApi.service.port }}/ws/live"
            - name: QUERY_API_HTTP_URL
              value: "http://{{ .Release.Name }}-query-api:{{ .Values.services.queryApi.service.port }}"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.liveDashboard.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.services.liveDashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-live-dashboard
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.liveDashboard.service.type }}
  ports:
    - port: {{ .Values.services.liveDashboard.service.port }}
      targetPort: {{ .Values.services.liveDashboard.containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "live-dashboard") | nindent 4 }}
{{- end }}
