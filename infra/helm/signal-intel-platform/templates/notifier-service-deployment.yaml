{{- if .Values.services.notifierService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-notifier-service
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
    {{- include "signal-intel-platform.selectorLabels" "notifier-service" | nindent 4 }}
spec:
  replicas: {{ .Values.services.notifierService.replicaCount }}
  selector:
    matchLabels:
      {{- include "signal-intel-platform.selectorLabels" "notifier-service" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signal-intel-platform.selectorLabels" "notifier-service" | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notifier-service
          image: {{ include "signal-intel-platform.image" (dict "root" $ "repository" .Values.services.notifierService.image.repository "tag" .Values.services.notifierService.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.services.notifierService.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.notifierService.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.services.notifierService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-notifier-service
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.notifierService.service.type }}
  ports:
    - port: {{ .Values.services.notifierService.service.port }}
      targetPort: {{ .Values.services.notifierService.containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "signal-intel-platform.selectorLabels" "notifier-service" | nindent 4 }}
{{- end }}
