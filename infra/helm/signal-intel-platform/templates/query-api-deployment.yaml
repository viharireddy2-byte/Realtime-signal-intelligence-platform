{{- if .Values.services.queryApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-query-api
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
    {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "query-api") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.services.queryApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "query-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "query-api") | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: query-api
          image: {{ include "signal-intel-platform.image" (dict "root" $ "repository" .Values.services.queryApi.image.repository "tag" .Values.services.queryApi.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.services.queryApi.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: POSTGRES_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: API_KEY
            - name: API_KEY_REQUIRED
              value: {{ .Values.services.queryApi.env.API_KEY_REQUIRED | quote }}
            - name: OTEL_SERVICE_NAME
              value: "query-api"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.queryApi.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.services.queryApi.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.queryApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-query-api
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.queryApi.service.type }}
  ports:
    - port: {{ .Values.services.queryApi.service.port }}
      targetPort: {{ .Values.services.queryApi.containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "signal-intel-platform.selectorLabels" (dict "root" $ "component" "query-api") | nindent 4 }}
{{- if and .Values.autoscaling.enabled .Values.services.queryApi.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-query-api
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-query-api
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
{{- if .Values.services.queryApi.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-query-api
  labels:
    {{- include "signal-intel-platform.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.services.queryApi.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.services.queryApi.ingress.className }}
  rules:
    {{- range .Values.services.queryApi.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-query-api
                port:
                  number: {{ $.Values.services.queryApi.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.services.queryApi.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
