name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/signal-intel-platform

jobs:
  # -------------------------------------------------------------------
  # Python services: lint, type-check, unit test
  # -------------------------------------------------------------------
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [query-api, notifier-service, live-dashboard]
        include:
          - service: query-api
            path: services/query-api
          - service: notifier-service
            path: services/notifier-service
          - service: live-dashboard
            path: services/live-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements.txt', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd ${{ matrix.path }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint with flake8
        run: |
          cd ${{ matrix.path }}
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: |
          cd ${{ matrix.path }}
          pip install black
          black --check --diff . || true

      - name: Unit tests with pytest
        run: |
          cd ${{ matrix.path }}
          if [ -d tests/unit ]; then pytest tests/unit --verbose; fi

  # -------------------------------------------------------------------
  # Streaming jobs: Flink (Java/Maven), Spark (Java/Maven)
  # -------------------------------------------------------------------
  jvm-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: [aggregation-job, anomaly-detection-job, session-analytics-job]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('streaming-jobs/{0}/pom.xml', matrix.job)) }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Maven tests
        run: |
          cd streaming-jobs/${{ matrix.job }}
          mvn -B clean test

      - name: Build JAR
        run: |
          cd streaming-jobs/${{ matrix.job }}
          mvn -B clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job }}-jar
          path: streaming-jobs/${{ matrix.job }}/target/*.jar

  # -------------------------------------------------------------------
  # k6 load-test script validation
  # -------------------------------------------------------------------
  loadtest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Validate k6 scripts
        run: |
          k6 run --vus 1 --iterations 1 loadtests/k6-scripts/high-throughput-events.js --no-thresholds

  # -------------------------------------------------------------------
  # Docker image builds
  # -------------------------------------------------------------------
  build-images:
    needs: [python-quality, jvm-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        component:
          - name: query-api
            context: services/query-api
          - name: notifier-service
            context: services/notifier-service
          - name: live-dashboard
            context: services/live-dashboard
          - name: event-producer
            context: ingestion/event-producer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Integration tests against live Postgres/Redis service containers
  # -------------------------------------------------------------------
  integration-tests:
    needs: [build-images]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: signalintel
          POSTGRES_USER: signalintel_admin
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize database schema
        run: |
          PGPASSWORD=password psql -h localhost -U signalintel_admin -d signalintel \
            -f infra/docker-compose/init-scripts/01-init-timescaledb.sql

      - name: Install and test query-api
        run: |
          cd services/query-api
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/integration --verbose
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: signalintel
          POSTGRES_USER: signalintel_admin
          POSTGRES_PASSWORD: password
          REDIS_HOST: localhost

      - name: Install and test notifier-service
        run: |
          cd services/notifier-service
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/integration --verbose
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: signalintel
          POSTGRES_USER: signalintel_admin
          POSTGRES_PASSWORD: password

  # -------------------------------------------------------------------
  # Security scanning
  # -------------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # -------------------------------------------------------------------
  # Deploy (staging -> load test -> production), main branch only
  # -------------------------------------------------------------------
  deploy-staging:
    needs: [integration-tests, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Deploy to staging
        run: |
          echo "helm upgrade --install signal-intel infra/helm/signal-intel-platform -n staging -f values-staging.yaml"
          # Wire up real cluster credentials via secrets before enabling this for real.

    outputs:
      deployment-url: "https://staging.signal-intel.example.com"

  load-test-staging:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests against staging
        run: |
          k6 run loadtests/k6-scripts/api-load-test.js \
            --env BASE_URL=${{ needs.deploy-staging.outputs.deployment-url }} \
            --out json=loadtest-results.json

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: loadtest-results.json

  deploy-production:
    needs: [load-test-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Deploy to production
        run: |
          echo "helm upgrade --install signal-intel infra/helm/signal-intel-platform -n production -f values-production.yaml"

  cleanup:
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Delete old container images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'signal-intel-platform-query-api'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
