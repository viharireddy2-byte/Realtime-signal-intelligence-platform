name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/signal-intel-platform

jobs:
  # -------------------------------------------------------------------
  # Python services: lint, type-check, unit test
  # -------------------------------------------------------------------
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [query-api, notifier-service, live-dashboard, event-producer]
        include:
          - service: query-api
            path: services/query-api
          - service: notifier-service
            path: services/notifier-service
          - service: live-dashboard
            path: services/live-dashboard
          - service: event-producer
            path: ingestion/event-producer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements.txt', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd ${{ matrix.path }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint with flake8
        run: |
          cd ${{ matrix.path }}
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: |
          cd ${{ matrix.path }}
          pip install black
          black --check --diff . || true

      - name: Unit tests with pytest
        run: |
          cd ${{ matrix.path }}
          if [ -d tests/unit ]; then pytest tests/unit --verbose; fi

  # -------------------------------------------------------------------
  # Streaming jobs: Flink (Java/Maven), Spark (Java/Maven)
  # -------------------------------------------------------------------
  jvm-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: [aggregation-job, anomaly-detection-job, session-analytics-job]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('streaming-jobs/{0}/pom.xml', matrix.job)) }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Maven tests
        run: |
          cd streaming-jobs/${{ matrix.job }}
          mvn -B clean test

      - name: Build JAR
        run: |
          cd streaming-jobs/${{ matrix.job }}
          mvn -B clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job }}-jar
          path: streaming-jobs/${{ matrix.job }}/target/*.jar

  # -------------------------------------------------------------------
  # Helm chart validation. `helm lint` + `helm template` both run
  # entirely offline (no cluster needed) and would have caught the
  # selectorLabels `$`-scoping bug fixed in _helpers.tpl -- every
  # Deployment/Service template failed to render before that fix,
  # meaning `helm install` would have failed for every service. This
  # job exists so that class of bug fails CI instead of a deploy.
  # -------------------------------------------------------------------
  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.4'

      - name: Add chart dependency repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      # Chart.yaml declares kafka/redis/postgresql/prometheus/grafana as
      # dependencies but the .tgz subcharts aren't vendored in the repo
      # (no charts/ dir, no Chart.lock). Without this, both `helm lint`
      # and `helm template` below fail with:
      #   "found in Chart.yaml, but missing in charts/ directory: ..."
      - name: helm dependency update
        run: helm dependency update infra/helm/signal-intel-platform

      - name: helm lint
        run: helm lint infra/helm/signal-intel-platform

      - name: helm template (renders every template with default values)
        run: helm template signal-intel infra/helm/signal-intel-platform > /tmp/rendered.yaml

      - name: helm template (autoscaling disabled, tracing disabled -- exercises the conditional branches)
        run: |
          helm template signal-intel infra/helm/signal-intel-platform \
            --set autoscaling.enabled=false \
            --set observability.tracing.enabled=false > /tmp/rendered-alt.yaml

      - name: Validate rendered manifests are well-formed YAML
        run: |
          python3 -c "
          import sys, yaml
          for path in ['/tmp/rendered.yaml', '/tmp/rendered-alt.yaml']:
              docs = list(yaml.safe_load_all(open(path)))
              print(f'{path}: {len(docs)} documents parsed OK')
          "

  # -------------------------------------------------------------------
  # Terraform validation. `terraform validate` is schema-aware (it knows
  # every argument aws_msk_cluster etc. actually accepts) in a way the
  # hcl2-parse-only check used during development is not -- this is the
  # real check. Runs with no AWS credentials (`validate` only needs the
  # provider plugin, not a live account) so it's safe to run on every PR.
  # -------------------------------------------------------------------
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'

      - name: terraform fmt -check
        # Informational, not blocking: these files were hand-written without
        # a local `terraform` binary to run `fmt` against first (see
        # infra/terraform/README.md), so a first-run formatting nit
        # shouldn't fail the pipeline. Run `terraform fmt -recursive
        # infra/terraform` once locally and this becomes a real gate.
        continue-on-error: true
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform init (no backend, no credentials needed)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

  # -------------------------------------------------------------------
  # k6 load-test script validation
  # -------------------------------------------------------------------
  loadtest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Validate k6 scripts
        run: |
          k6 run --vus 1 --iterations 1 loadtests/k6-scripts/high-throughput-events.js --no-thresholds

  # -------------------------------------------------------------------
  # Docker image builds
  # -------------------------------------------------------------------
  build-images:
    needs: [python-quality, jvm-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        component:
          - name: query-api
            context: services/query-api
          - name: notifier-service
            context: services/notifier-service
          - name: live-dashboard
            context: services/live-dashboard
          - name: event-producer
            context: ingestion/event-producer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Integration tests against live Postgres/Redis service containers
  # -------------------------------------------------------------------
  integration-tests:
    needs: [build-images]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: signalintel
          POSTGRES_USER: signalintel_admin
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize database schema
        run: |
          PGPASSWORD=password psql -h localhost -U signalintel_admin -d signalintel \
            -f infra/docker-compose/init-scripts/01-init-timescaledb.sql

      - name: Install and test query-api
        run: |
          cd services/query-api
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/integration --verbose
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: signalintel
          POSTGRES_USER: signalintel_admin
          POSTGRES_PASSWORD: password
          REDIS_HOST: localhost

      - name: Install and test notifier-service
        run: |
          cd services/notifier-service
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/integration --verbose
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: signalintel
          POSTGRES_USER: signalintel_admin
          POSTGRES_PASSWORD: password

  # -------------------------------------------------------------------
  # Security scanning
  # -------------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Cache the vulnerability DB across runs. `@master` was floating and
      # re-pulling the full DB from ghcr.io/aquasecurity/trivy-db on every
      # run, which regularly hit ghcr.io's anonymous-pull rate limit
      # (TOOMANYREQUESTS) and failed this step with exit code 1. Pinning to
      # a released version plus caching avoids both the surprise-breakage
      # risk of `@master` and the repeated cold downloads.
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          cache: 'true'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # -------------------------------------------------------------------
  # Deploy (staging -> load test -> production), main branch only
  # -------------------------------------------------------------------
  deploy-staging:
    needs: [integration-tests, security-scan, helm-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Deploy to staging
        run: |
          echo "helm upgrade --install signal-intel infra/helm/signal-intel-platform -n staging -f values-staging.yaml"
          # Wire up real cluster credentials via secrets before enabling this for real.

    outputs:
      deployment-url: "https://staging.signal-intel.example.com"

  load-test-staging:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests against staging
        run: |
          k6 run loadtests/k6-scripts/api-load-test.js \
            --env BASE_URL=${{ needs.deploy-staging.outputs.deployment-url }} \
            --out json=loadtest-results.json

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: loadtest-results.json

  deploy-production:
    needs: [load-test-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Deploy to production
        run: |
          echo "helm upgrade --install signal-intel infra/helm/signal-intel-platform -n production -f values-production.yaml"

  cleanup:
    needs: [deploy-production]
    runs-on: ubuntu-latest
    # `always()` bypasses the implicit "needs succeeded" check entirely, so
    # this used to run even on PR runs where build-images/deploy-production
    # never run (they're gated on github.event_name == 'push') and no image
    # was ever pushed. Scope it back to push events, matching the jobs it
    # depends on.
    if: always() && github.event_name == 'push'

    permissions:
      packages: write

    steps:
      # On the very first successful push, ghcr.io has no
      # "signal-intel-platform-query-api" package yet, so the API this
      # action calls 404s with "get versions API failed. Package not
      # found." Don't fail the whole pipeline over that -- there's simply
      # nothing to clean up yet. From the second successful push onward
      # (once build-images has pushed at least one version) this step
      # does real work.
      - name: Delete old container images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'signal-intel-platform-query-api'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
